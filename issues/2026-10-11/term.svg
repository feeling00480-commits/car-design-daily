<svg class="diagram" viewBox="0 0 520 210" width="100%" role="img" aria-label="Strike-through graphic 貫穿線圖形示意圖：正面四線頭燈與後方水平貫穿燈帶，以虛線標示同一視覺母題">
<text x="130" y="18" fill="currentColor" font-size="11" text-anchor="middle" opacity=".7">車頭：四線頭燈</text>
<text x="390" y="18" fill="currentColor" font-size="11" text-anchor="middle" opacity=".7">車尾：水平貫穿</text>
<line x1="260" y1="26" x2="260" y2="155" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
<!-- front face outline -->
<path d="M30,140 L40,90 L80,70 L180,65 L220,85 L230,140 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<!-- ribbed metal center -->
<path d="M110,85 L150,82 L150,115 L110,118 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="118" y1="88" x2="118" y2="115" stroke="currentColor" stroke-width="1" opacity=".5"/>
<line x1="126" y1="87" x2="126" y2="114" stroke="currentColor" stroke-width="1" opacity=".5"/>
<line x1="134" y1="86" x2="134" y2="113" stroke="currentColor" stroke-width="1" opacity=".5"/>
<line x1="142" y1="85" x2="142" y2="112" stroke="currentColor" stroke-width="1" opacity=".5"/>
<!-- four ultra-thin lamps -->
<line x1="55" y1="95" x2="100" y2="92" stroke="#f08a5d" stroke-width="3" stroke-linecap="round"/>
<line x1="55" y1="105" x2="100" y2="102" stroke="#f08a5d" stroke-width="3" stroke-linecap="round"/>
<line x1="160" y1="90" x2="210" y2="93" stroke="#f08a5d" stroke-width="3" stroke-linecap="round"/>
<line x1="160" y1="100" x2="210" y2="103" stroke="#f08a5d" stroke-width="3" stroke-linecap="round"/>
<text x="130" y="155" fill="#f08a5d" font-size="10" text-anchor="middle">四條細線 · 強調寬度</text>
<!-- rear three-quarter -->
<path d="M290,140 L300,95 L340,72 L460,68 L490,95 L500,140 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<!-- wraparound metal rear panel -->
<path d="M320,100 L480,95 L485,125 L325,130 Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
<!-- horizontal strike-through -->
<line x1="325" y1="112" x2="480" y2="108" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round"/>
<!-- hidden lamp hint -->
<rect x="400" y="105" width="36" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2" opacity=".6"/>
<text x="395" y="155" fill="#f08a5d" font-size="10" text-anchor="middle">水平貫穿 · 燈藏於面內</text>
<!-- connecting dashed motif -->
<path d="M230,98 C250,70 270,70 290,98" fill="none" stroke="#f08a5d" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="260" y="62" fill="#f08a5d" font-size="10" text-anchor="middle">同一母題</text>
<text x="260" y="178" fill="currentColor" font-size="10.5" text-anchor="middle" opacity=".7">把一條「劃破」的水平線當成品牌識別，從頭貫到尾</text>
<text x="260" y="196" fill="#f08a5d" font-size="10" text-anchor="middle">本期例子：Jaguar Type 01 的 strike-through graphic</text>
</svg>
