<svg class="diagram" viewBox="0 0 520 200" width="100%" role="img" aria-label="Pop-down headlamp 下掀頭燈示意圖：左為傳統上掀、右為下掀式，箭頭標示蓋板運動方向">
<text x="130" y="18" fill="currentColor" font-size="11" text-anchor="middle" opacity=".7">傳統 Pop-up（上掀）</text>
<text x="390" y="18" fill="currentColor" font-size="11" text-anchor="middle" opacity=".7">Pop-down（下掀）</text>
<line x1="260" y1="26" x2="260" y2="168" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
<!-- left: hood with pop-up lamp raised -->
<path d="M20,130 L28,108 L80,98 L150,92 L220,100 L236,130 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<!-- raised cover standing up -->
<path d="M72,98 L72,58 L118,58 L118,96" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="78" y="66" width="34" height="22" rx="2" fill="none" stroke="#f08a5d" stroke-width="2"/>
<line x1="82" y1="77" x2="108" y2="77" stroke="#f08a5d" stroke-width="2"/>
<!-- up arrow -->
<path d="M95,52 L95,38" stroke="#f08a5d" stroke-width="2" fill="none"/>
<path d="M88,44 L95,36 L102,44" stroke="#f08a5d" stroke-width="2" fill="none"/>
<text x="130" y="48" fill="#f08a5d" font-size="10">蓋板向上掀開</text>
<text x="130" y="152" fill="currentColor" font-size="10" text-anchor="middle" opacity=".7">突出邊緣 · 行人保護風險</text>
<!-- right: flush hood with cover flipping down -->
<path d="M284,130 L292,108 L344,98 L414,92 L484,100 L500,130 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
<!-- flush cover recessing down into body -->
<rect x="336" y="88" width="52" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
<!-- lamp revealed as slim LED -->
<rect x="342" y="92" width="40" height="6" rx="1.5" fill="#f08a5d" stroke="none"/>
<!-- french flag hint dots -->
<circle cx="388" cy="95" r="2" fill="#0055A4"/><circle cx="396" cy="95" r="2" fill="#fff" stroke="currentColor" stroke-width=".5"/><circle cx="404" cy="95" r="2" fill="#EF4135"/>
<!-- down arrow into body -->
<path d="M362,108 L362,128" stroke="#f08a5d" stroke-width="2" fill="none"/>
<path d="M355,122 L362,132 L369,122" stroke="#f08a5d" stroke-width="2" fill="none"/>
<text x="420" y="124" fill="#f08a5d" font-size="10">蓋板向下收入</text>
<text x="390" y="152" fill="currentColor" font-size="10" text-anchor="middle" opacity=".7">與引擎蓋齊平 · 符合法規</text>
<!-- bottom note -->
<text x="260" y="178" fill="currentColor" font-size="10.5" text-anchor="middle" opacity=".7">同一「隱藏頭燈」情感，改成向下收入以避免尖銳突出物</text>
<text x="260" y="194" fill="#f08a5d" font-size="10" text-anchor="middle">本期例子：Alpine PS1 預告的下掀頭燈</text>
</svg>
